---
services:
  # Run Bats unit tests
  test-bats:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-bats

  # Validate init.sh flag parsing
  test-init:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-init

  # Test dotfile linking on a clean Debian system
  test-dotfiles:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-dotfiles

  # Test base profile install (lite mode)
  test-base:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-base

  # Test security profile configs and hardening
  test-security:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-security

  # Full-mode security steps: CrowdSec and the audit tools
  test-security-full:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-security-full

  # Security profile on a node the infra repo manages (SSH, UFW, Fail2Ban skipped)
  test-security-infra:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-security-infra

  # setup-kubernetes.sh: fresh install, then full mode moving kubectl off an old channel
  test-kubernetes:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-kubernetes

  # Full integration test (all profiles, lite mode)
  test-full:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
      target: test-full
