# Cloudflare Worker receiving the webhooks of the GitHub App that keeps the
# organization's board and the triage labels in step
# (docs/config/issue-workflow.md#project-board).
# Deploy: `npx wrangler deploy --config .github/project-board/wrangler.toml`.
# Secrets are never written here: set WEBHOOK_SECRET, GITHUB_APP_ID,
# GITHUB_APP_PRIVATE_KEY and BOARD_TOKEN with `npx wrangler secret put <name>`.
name = "project-board"
main = "worker.mjs"
compatibility_date = "2026-11-01"
# Only the public *.workers.dev address is used; no route, no custom domain.
workers_dev = true

[vars]
PROJECT_OWNER = "kevindb-labs"
PROJECT_NUMBER = "1"
# Accounts whose repositories use the triage labels (comma-separated). The App
# is public, so anyone may install it: the Worker ignores every other owner.
REPOSITORY_OWNERS = "KevinDeBenedetti,kevindb-labs"

[observability]
enabled = true
