---
name: Project board

# Deploys the Cloudflare Worker that keeps the organization's board and the
# triage labels in step (docs/config/issue-workflow.md#project-board), when its
# code changes on main. A Worker deployed by hand fell two commits behind for
# two days: the labels and the board drifted apart meanwhile.
on:
  push:
    branches: [main]
    paths:
      - '.github/project-board/**'
      - '.github/workflows/project-board.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in the order of the pushes; a running one is not cut.
concurrency:
  group: project-board-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the Worker
    runs-on: ubuntu-latest
    # A manual run deploys main only, like a push.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Bats helpers are submodules.
          submodules: true
          persist-credentials: false

      - name: Install Bats
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bats

      - name: Test the Worker
        run: bats tests/project-board.bats

      # The Worker answers a GET with VERSION: the commit it runs.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/config/issue-workflow.md#project-board)"
            exit 1
          fi
          npx --yes wrangler@4.168.0 deploy --config .github/project-board/wrangler.toml --var "VERSION:$GITHUB_SHA"
