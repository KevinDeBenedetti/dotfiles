# Keeps the GitHub Project board in step with the triage labels: each issue is
# added to the project and its Stage field set from its label, by
# .github/scripts/project-stage.sh (docs/config/issue-workflow.md#project-board).
#
# Needs the PROJECT_NUMBER repository variable and the PROJECT_TOKEN secret, a
# classic personal access token with the `project` scope: GITHUB_TOKEN and
# GitHub Apps cannot write to a project owned by a user. The job is skipped
# until PROJECT_NUMBER is set; with the variable set and no secret, it fails
# and names the secret. A manual run syncs every open issue (backfill).
---
name: Project board

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

# Deny-all default: the job reads the repository only, and writes to the
# project with PROJECT_TOKEN.
permissions: {}

concurrency:
  # One run per issue at a time, in order: a label added then removed ends on
  # the right column.
  group: project-stage-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  stage:
    name: Sync Stage
    if: vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # The event reaches the script through env only: an issue can be opened
      # by anyone, and nothing of it is interpolated into the command.
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ISSUE_STATE: ${{ github.event.issue.state == 'closed' && 'CLOSED' || 'OPEN' }}
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: bash .github/scripts/project-stage.sh
