# Keeps the GitHub Project board in step with the triage labels: each issue is
# added to the project and its Stage field set from its label, by
# .github/scripts/project-stage.sh (docs/config/issue-workflow.md#project-board).
#
# Needs the PROJECT_NUMBER repository variable (PROJECT_OWNER too when the
# project is not the repository owner's) and the PROJECT_TOKEN secret, a
# classic personal access token with the `project` scope. The job is skipped
# until PROJECT_NUMBER is set; with the variable set and no secret, it fails
# and names the secret. A manual run syncs every open issue (backfill).
# The other direction, from a card moved on the board to the labels, is the
# Cloudflare Worker in .github/project-board/.
---
name: Project board

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

# Deny-all default: the job reads the repository only, and writes to the
# project with PROJECT_TOKEN.
permissions: {}

concurrency:
  # One run per issue at a time, in order: a label added then removed ends on
  # the right column.
  group: project-stage-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  stage:
    name: Sync Stage
    if: vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Only the issue's id reaches the script, through env: an issue can be
      # opened by anyone, and nothing of it is interpolated into the command.
      # The script reads the issue's labels and state back from GitHub.
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: bash .github/scripts/project-stage.sh
