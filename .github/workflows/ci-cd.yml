---
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@main
    with:
      run-shellcheck: true
      run-bats: true
      run-docker: true
      docker-targets: '["test-bats","test-init","test-dotfiles","test-base","test-security","test-full"]'
      run-link-check: true
      link-check-paths: 'docs/**/*.md'
      run-docs-link-check: true

  security:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      run-node-audit: false # no Node.js project
      run-codeql: false     # shell scripts are not supported by CodeQL
    secrets: inherit

  bot-check:
    if: github.event_name == 'pull_request'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/check-bot-commits.yml@main
    permissions:
      contents: read
      pull-requests: read

  # ── Dispatch docs rebuild ──────────────────────────────────────────────────
  dispatch:
    name: Dispatch docs rebuild
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@main
    with:
      client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

  # ── Release (release-please) ───────────────────────────────────────────────
  # Config & manifest live in .github/release/. The committed manifest is seeded
  # at 0.0.0, so the first release PR cuts v0.1.0 (feat-driven minor bump, since
  # we're pre-1.0). initial-version below is only a fallback used if the manifest
  # is ever missing — the committed manifest is what actually drives the version.
  release:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      initial-version: '0.1.0'
