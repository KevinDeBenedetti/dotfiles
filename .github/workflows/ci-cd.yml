---
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for every job (notably `ci`, which declares none).
# Jobs needing more (security, release, …) widen this themselves.
permissions:
  contents: read

jobs:
  ci:
    # Skip on the release-please PR (bot-authored branch of THIS repo — a branch
    # name alone is not enough: any fork could name one release-please-*, and a
    # skipped job counts as passed for required checks) and on the merged
    # "chore(main): release x.y.z" commit — the `release` job gates on these
    # results via always(), so a skipped run is not a failure and the tag is
    # still minted without re-running the full suite on the release commit.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(main): release')
      && !(startsWith(github.head_ref, 'release-please')
           && github.event.pull_request.head.repo.full_name == github.repository
           && github.event.pull_request.user.login == 'github-actions[bot]') }}
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    with:
      run-shellcheck: true
      # The extensionless scripts too, as `make lint` and the prek hook do: a
      # file these globs match is checked when it declares a supported shell.
      shellcheck-extra-paths: 'scripts/*/*'
      run-bats: true
      run-docker: true
      docker-targets: '["test-bats","test-init","test-dotfiles","test-base","test-security","test-security-full","test-security-infra","test-kubernetes","test-full"]'
      run-link-check: true
      link-check-paths: 'docs/**/*.md'
      run-docs-link-check: true

  # The Bats suites outside tests/: the reusable workflow runs one directory,
  # without its sub-directories (those hold the vendored helpers' own suites),
  # so each extra directory of the Makefile's BATS_DIRS gets a run here.
  ci-suites:
    # Same guard as `ci`: skip on the release-please PR and the release commit.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(main): release')
      && !(startsWith(github.head_ref, 'release-please')
           && github.event.pull_request.head.repo.full_name == github.repository
           && github.event.pull_request.user.login == 'github-actions[bot]') }}
    strategy:
      fail-fast: false
      matrix:
        tests-dir: [tests/ai/, tests/ollama/]
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    with:
      run-shellcheck: false
      run-actionlint: false
      run-bats: true
      bats-tests-dir: ${{ matrix.tests-dir }}

  security:
    # Same guard as `ci`: skip on the release-please PR and the release commit.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(main): release')
      && !(startsWith(github.head_ref, 'release-please')
           && github.event.pull_request.head.repo.full_name == github.repository
           && github.event.pull_request.user.login == 'github-actions[bot]') }}
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    # No `secrets:` block (least privilege): security.yml declares no
    # workflow_call secrets and uses only the auto-provided GITHUB_TOKEN, so
    # there is nothing to inherit. Re-add an explicit allow-list only if the
    # reusable workflow starts requiring a passed secret.
    with:
      run-node-audit: false # no npm dependencies (the board Worker has none)
      run-codeql: false     # shell scripts are not supported by CodeQL

  bot-check:
    if: github.event_name == 'pull_request'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/check-bot-commits.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    permissions:
      contents: read
      pull-requests: read
    with:
      # release-please opens its release PRs with GITHUB_TOKEN, i.e. as this
      # bot; allow it so the "chore(main): release x.y.z" PR passes the guard.
      # release-please-global[bot] opens the github-workflows bumps, on each
      # of its releases (its propagate-release job). renovate[bot] opens the
      # dependency updates that renovate.json describes, once the Renovate
      # GitHub App is installed on this repository (issue 79).
      allowed-bots: '["github-actions[bot]", "release-please-global[bot]", "renovate[bot]"]'

  # ── Release (release-please) ───────────────────────────────────────────────
  # Config & manifest live in .github/release/. v0.1.0 has shipped, so the
  # one-off `release-as: 0.1.0` bootstrap has been removed from the config and
  # normal bump-minor-pre-major versioning is in effect (0.2.0, 0.3.0, …).
  # initial-version below is only a fallback used if the manifest is ever missing.
  release:
    name: Release Please
    # Wait for CI: release-please only opens/updates the release PR (and later
    # tags) once `ci` and `security` are green on the push to main. always()
    # keeps this running even when those jobs are *skipped* on the release
    # commit (skipped ≠ failure), so the tag is still created.
    needs: [ci, ci-suites, security]
    if: >-
      ${{ always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci.result != 'failure' && needs.ci.result != 'cancelled'
      && needs.ci-suites.result != 'failure' && needs.ci-suites.result != 'cancelled'
      && needs.security.result != 'failure' && needs.security.result != 'cancelled' }}
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@25f03b7fb1c141105b83b5da0c5c3daf9576afe3 # v0.55.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # No token secret: release-please runs on GITHUB_TOKEN (needs "Allow GitHub
    # Actions to create and approve pull requests"; CI on the release PR waits
    # for "Approve workflows to run").
    with:
      initial-version: '0.1.0'
