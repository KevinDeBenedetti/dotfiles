---
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-shell.yml@main
    with:
      run-shellcheck: true
      run-bats: true
      run-docker: true
      docker-targets: '["test-bats","test-init","test-dotfiles","test-base","test-security","test-full"]'
      run-link-check: true
      link-check-paths: 'docs/**/*.md'
      run-docs-link-check: true

  security:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/security.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      run-node-audit: false # no Node.js project
      run-codeql: false     # shell scripts are not supported by CodeQL
    secrets: inherit

  bot-check:
    if: github.event_name == 'pull_request'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/check-bot-commits.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # release-please opens its release PRs as this bot; allow it so the
      # auto-generated "chore(main): release x.y.z" PR passes the bot guard.
      allowed-bots: '["release-please-global[bot]"]'

  # ── Dispatch docs rebuild ──────────────────────────────────────────────────
  dispatch:
    name: Dispatch docs rebuild
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docs.yml@main
    with:
      client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

  # ── Release (release-please) ───────────────────────────────────────────────
  # Config & manifest live in .github/release/. v0.1.0 has shipped, so the
  # one-off `release-as: 0.1.0` bootstrap has been removed from the config and
  # normal bump-minor-pre-major versioning is in effect (0.2.0, 0.3.0, …).
  # initial-version below is only a fallback used if the manifest is ever missing.
  release:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      initial-version: '0.1.0'
      # Mint a GitHub App token so the release PR is attributed to the App, not
      # github-actions[bot]: this triggers CI on the PR and avoids the manual
      # workflow-approval gate that GITHUB_TOKEN-authored PRs hit.
      app-client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
