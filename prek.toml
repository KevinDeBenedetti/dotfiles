# =============================================================================
# prek.toml — git hook configuration (https://prek.j178.dev)
# prek is a faster, dependency-free alternative to pre-commit (written in Rust)
#
# Install prek:   brew install j178/tap/prek
# Install hooks:  prek install       (run once after cloning)
# Run all:        prek run --all-files
# Run staged:     prek run
# Update revs:    Renovate (renovate.json); by hand, `prek autoupdate --freeze`
#
# Each hook repository is pinned by commit SHA, its tag kept in a `# frozen:`
# comment (what `--freeze` writes, and what the shared Renovate preset reads):
# a tag can be moved, a SHA cannot.
# =============================================================================

minimum_prek_version = "0.3.0"
fail_fast = false
default_install_hook_types = ["pre-commit", "pre-push"]

# ─── General file hygiene ───────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
# renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
rev = "cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b"  # frozen: v5.0.0
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

# ─── Secret scanning ────────────────────────────────────────────────────────
# Gitleaks reads .gitleaks.toml at the repo root automatically. Unlike
# detect-private-key (which only matches PEM key headers), it catches
# passwords, tokens and high-entropy strings before they are committed.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
# renovate: datasource=github-tags depName=gitleaks/gitleaks
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [
  { id = "gitleaks", stages = ["pre-commit"] },
]

# ─── Shell script linting ───────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
# renovate: datasource=github-tags depName=shellcheck-py/shellcheck-py
rev = "a23f6b85d0fdd5bb9d564e2579e678033debbdff"  # frozen: v0.10.0.1
hooks = [
  {
    id = "shellcheck",
    args = ["--severity=warning", "--shell=bash"],
    # *.sh, plus the extensionless commands of scripts/<domain>/ (make lint
    # covers the same set).
    files = "(\\.sh$|^scripts/[^/]+/[^/.]+$)",
    exclude = "tests/test_helper/",
  },
]

# ─── YAML linting ───────────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/adrienverge/yamllint"
# renovate: datasource=github-tags depName=adrienverge/yamllint
rev = "be92e15345b32661abee2e675d765ae79686eb4c"  # frozen: v1.37.0
hooks = [
  { id = "yamllint", args = ["--config-file", ".yamllint.yml"] },
]

# ─── GitHub Actions workflow linting ────────────────────────────────────────
[[repos]]
repo = "https://github.com/rhysd/actionlint"
# renovate: datasource=github-tags depName=rhysd/actionlint
rev = "0933c147c9d6587653d45fdcb4c497c57a65f9af"  # frozen: v1.7.10
hooks = [
  { id = "actionlint" },
]

# ─── Reusable hooks (KevinDeBenedetti/github-workflows) ──────────────────────
# - check-docs-links: relative links in docs/ must not escape docs/
# Commit-message generation is handled by scripts/ai/git-aicommit (`git aicommit`),
# not by git hooks.
[[repos]]
repo = "https://github.com/KevinDeBenedetti/github-workflows"
# Pinned by tag, unlike the others: github-workflows' propagate-release job
# moves this pin with each of its releases, and reads a tag here.
# renovate: datasource=github-tags depName=KevinDeBenedetti/github-workflows
rev = "v0.56.2"
hooks = [
  { id = "check-docs-links" },
]

# ─── Local hooks ────────────────────────────────────────────────────────────
[[repos]]
repo = "local"

[[repos.hooks]]
id = "bats-affected"
name = "BATS — tests covering the staged files"
# The commit's fast path: only the Bats files that name a staged file (or its
# directory), the whole suite when none does (scripts/bats-affected.sh).
language = "system"
entry = "bash scripts/bats-affected.sh"
pass_filenames = true
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "bats"
name = "BATS — unit tests"
# Runs the whole offline test suite before every push, like the CI `Bats tests`
# job: what the commit's fast path left out is checked there. A failing test
# blocks; a missing bats only warns. scripts/bats-run.sh runs the files in
# parallel (within the files too with GNU parallel: brew install parallel) and
# hides git's hook environment (GIT_DIR, …) from the fixtures.
# Install bats: brew install bats-core
language = "system"
entry = "bash scripts/bats-run.sh tests/ tests/ai/ tests/ollama/"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "lychee"
name = "lychee — docs link check (offline)"
# Mirrors the CI `Link check` job for local links; --offline skips remote
# URLs so the hook stays fast and works without network.
# Install lychee: brew install lychee
language = "system"
entry = "bash -c 'if which lychee >/dev/null 2>&1; then lychee --offline --no-progress \"docs/**/*.md\"; else echo \"⚠️  lychee not installed — skipping (brew install lychee)\"; fi'"
pass_filenames = false
files = "^docs/.*\\.md$"
stages = ["pre-commit", "pre-push"]
